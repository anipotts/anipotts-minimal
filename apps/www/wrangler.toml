# PREVIEW worker for the astro rebuild. workers_dev ONLY, no routes.
# The production apex (anipotts.com) keeps serving the existing worker
# until ani runs the supervised cutover (phase 2/3). Do not add a route
# here without that sign-off.
name = "anipotts-www-astro"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"
workers_dev = true
account_id = "0f856093bdcd34a7da1bde5ee4385163"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

[observability]
enabled = true
