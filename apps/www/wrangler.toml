name = "anipotts-www"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = ".open-next/worker.js"
workers_dev = true

# Custom domains (CF DNS already manages anipotts.com)
[[routes]]
pattern = "anipotts.com/*"
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

# Cloudflare Email Routing send binding (contact form)
# Destination must be verified in CF dashboard -> Email Routing.
[[send_email]]
name = "SEND_EMAIL"
destination_address = "contact@anipotts.com"
