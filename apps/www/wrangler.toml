# PREVIEW worker for the astro rebuild.
# Production now serves the astro rebuild after the supervised cutover.
# The previous production worker and page snapshot are preserved at:
# /Users/anipotts/Infra/archives/anipotts-com/20260616T012737Z-pre-astro-cutover
name = "anipotts-www-astro"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"
workers_dev = true
account_id = "0f856093bdcd34a7da1bde5ee4385163"

[[routes]]
pattern = "staging.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[[routes]]
pattern = "anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
# assets serve first; the worker only fires for paths with no static file.
# this is what lets the middleware redirect map see /lab, /thoughts, /work,
# /labs without intercepting prerendered /writing/[slug] HTML.
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

[observability]
enabled = true
