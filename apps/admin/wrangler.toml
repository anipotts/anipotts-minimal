name = "anipotts-admin"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "./dist/_worker.js/index.js"
workers_dev = false

# Transitional custom domain while the Astro admin reaches parity. The canonical
# admin.anipotts.com route still belongs to apps/admin-solid until cutover proof.
[[routes]]
pattern = "legacy-admin.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true

# Non-secret env vars available at runtime
[vars]
PUBLIC_STATE_API = "https://api.anipotts.com"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"
