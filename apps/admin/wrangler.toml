name = "anipotts-admin"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "@astrojs/cloudflare/entrypoints/server"
workers_dev = false

# Canonical admin route. Cloudflare Access remains in front until app-native
# passkey proof is complete and Access removal is separately verified.
[[routes]]
pattern = "admin.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"

[assets]
binding = "ASSETS"
directory = "./dist"
run_worker_first = true

# Non-secret env vars available at runtime
[vars]
PUBLIC_STATE_API = "https://api.anipotts.com"
ACCESS_TEAM_DOMAIN = "https://anipotts.cloudflareaccess.com"
ACCESS_POLICY_AUD = "ca3ea64cba714dee7d50eae63f62b18d6c2aeeecc0fc16ec0335ed0aa863a49f"

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"
