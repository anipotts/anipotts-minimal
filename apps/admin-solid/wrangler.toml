name = "anipotts-admin-solid"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "worker-entry.mjs"
workers_dev = false

[assets]
directory = ".output/public"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"

# Build-time inlined as PUBLIC_*; runtime override available via wrangler vars
[vars]
PUBLIC_STATE_API = "https://api.anipotts.com"

# Legacy rollback route after apps/admin claims the canonical admin.anipotts.com
# custom domain. Do not restore this worker to the canonical route unless
# rolling back the Astro admin cutover.
[[routes]]
pattern = "legacy-admin-solid.anipotts.com"
custom_domain = true
zone_id = "d56476e2905a2a19ad86aaa4b7c719c2"
