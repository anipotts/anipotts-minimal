name = "anipotts-ingest"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
account_id = "0f856093bdcd34a7da1bde5ee4385163"
main = "src/index.ts"
workers_dev = true

# Non-secret env vars (secrets set via `wrangler secret put`)
[vars]
CF_ACCOUNT_ID = "0f856093bdcd34a7da1bde5ee4385163"

# Cron: fires every minute, dispatcher picks jobs by minute offset
[triggers]
crons = ["* * * * *"]

# D1 database binding
[[d1_databases]]
binding = "DB"
database_name = "anipotts-db"
database_id = "a8aadf73-bbf4-447c-97db-cb3e50b4e26f"
