name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deploy target rules
        run: pnpm test:deploy-targets

      - name: Validate formatting
        run: pnpm format:check

      - name: Validate affected packages
        env:
          TURBO_SCM_BASE: origin/${{ github.base_ref }}
          TURBO_SCM_HEAD: HEAD
        run: |
          pnpm turbo build --affected --output-logs=errors-only
          pnpm turbo lint --affected --output-logs=errors-only
          pnpm turbo typecheck --affected --output-logs=errors-only
          pnpm turbo test --affected --output-logs=errors-only
