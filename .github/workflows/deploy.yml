# Required GitHub Secrets:
#   CLOUDFLARE_API_TOKEN    - Cloudflare API token with Workers deploy permissions
#   CLOUDFLARE_ACCOUNT_ID   - 0f856093bdcd34a7da1bde5ee4385163
#   ADMIN_PASSWORD          - Admin UI password
#   BUTTONDOWN_API_KEY      - Buttondown newsletter API key
#   RESEND_API_KEY          - Resend API key for newsletter worker deployments
#   NEWSLETTER_MAILING_ADDRESS - Physical mailing address for newsletter issue footers
#   TYPEFULLY_API_KEY       - Typefully API key
#   TYPEFULLY_SOCIAL_SET_ID - Typefully social set ID
#
# Path-filtered deploys: each deploy-X job only runs when files relevant to
# that target actually changed. Lockfile / root package.json changes trigger
# every deployed target (dep updates can affect any target). Docs-only commits skip the
# workflow entirely via paths-ignore. No untrusted input is interpolated
# into run: blocks anywhere in this workflow.

name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      www: ${{ steps.filter.outputs.www }}
      admin: ${{ steps.filter.outputs.admin }}
      labs: ${{ steps.filter.outputs.labs }}
      ingest: ${{ steps.filter.outputs.ingest }}
      newsletter: ${{ steps.filter.outputs.newsletter }}
      weekly-email: ${{ steps.filter.outputs.weekly-email }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared: &shared
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "packages/**"
              - ".github/workflows/deploy.yml"
            www:
              - *shared
              - "apps/www/**"
            admin:
              - *shared
              - "apps/admin/**"
              - "services/**"
            labs:
              - *shared
              - "apps/labs/**"
            ingest:
              - "workers/ingest/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - ".github/workflows/deploy.yml"
            newsletter:
              - "workers/newsletter/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/deploy.yml"
            weekly-email:
              - "workers/weekly-email/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - ".github/workflows/deploy.yml"

  validate:
    name: Build, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build

      - name: Lint
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Test
        run: pnpm turbo test

  deploy-www:
    name: Deploy www
    needs: [changes, validate]
    if: needs.changes.outputs.www == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build www (Astro)
        run: pnpm turbo build --filter=@anipotts/www
        env:
          # Astro's static build bakes PUBLIC_* vars at build time. Add these as
          # GitHub Actions secrets to enable analytics + the connect-form turnstile.
          # Absent = those features no-op and the build still succeeds.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}

      # apps/www is Astro (@astrojs/cloudflare). `astro build` already emits the
      # worker bundle at dist/_worker.js; no opennextjs adapter step here.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/www
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-admin:
    name: Deploy admin
    needs: [changes, validate]
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin
        run: pnpm turbo build --filter=@anipotts/admin
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          TYPEFULLY_API_KEY: ${{ secrets.TYPEFULLY_API_KEY }}
          TYPEFULLY_SOCIAL_SET_ID: ${{ secrets.TYPEFULLY_SOCIAL_SET_ID }}
          NEXT_PUBLIC_MINI_API_KEY: ${{ secrets.MINI_API_KEY }}

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        working-directory: apps/admin

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/admin
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-labs:
    name: Deploy labs
    needs: [changes, validate]
    if: needs.changes.outputs.labs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build labs
        run: pnpm turbo build --filter=@anipotts/labs

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build
        working-directory: apps/labs

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: apps/labs
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-ingest:
    name: Deploy ingest worker
    needs: [changes, validate]
    if: needs.changes.outputs.ingest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: workers/ingest
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-weekly-email:
    name: Deploy weekly email worker
    needs: [changes, validate]
    if: needs.changes.outputs.weekly-email == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          workingDirectory: workers/weekly-email
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-newsletter:
    name: Deploy newsletter worker
    needs: [changes, validate]
    if: needs.changes.outputs.newsletter == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.5.2"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck newsletter worker
        run: pnpm --filter @anipotts/newsletter-worker typecheck

      - name: Prepare newsletter secrets
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = process.env.NEWSLETTER_SECRETS_FILE;
          const secrets = {};
          if (!process.env.RESEND_API_KEY) {
            console.error("::error::RESEND_API_KEY GitHub secret is missing");
            process.exit(1);
          }
          secrets.RESEND_API_KEY = process.env.RESEND_API_KEY;
          if (process.env.NEWSLETTER_MAILING_ADDRESS) {
            secrets.NEWSLETTER_MAILING_ADDRESS = process.env.NEWSLETTER_MAILING_ADDRESS;
          } else {
            console.warn("::warning::NEWSLETTER_MAILING_ADDRESS is missing; issue sends will fail until it is set");
          }
          fs.writeFileSync(path, JSON.stringify(secrets));
          NODE
        env:
          NEWSLETTER_SECRETS_FILE: ${{ runner.temp }}/newsletter-secrets.json
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_MAILING_ADDRESS: ${{ secrets.NEWSLETTER_MAILING_ADDRESS }}

      - name: Deploy to Cloudflare Workers
        run: pnpm exec wrangler --cwd workers/newsletter deploy --keep-vars --secrets-file "$NEWSLETTER_SECRETS_FILE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEWSLETTER_SECRETS_FILE: ${{ runner.temp }}/newsletter-secrets.json
