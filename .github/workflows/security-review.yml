name: Security Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: No external security reviewer
        run: |
          echo "Claude/Anthropic security review is disabled for this repository."
          echo "This check intentionally performs no external API calls."
          echo "Use local review, tests, and focused human review for sensitive changes."
