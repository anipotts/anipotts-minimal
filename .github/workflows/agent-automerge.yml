name: Agent Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  checks: read
  contents: write
  pull-requests: write

concurrency:
  group: agent-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        startsWith(github.event.pull_request.head.ref, 'codex/') ||
        startsWith(github.event.pull_request.head.ref, 'claude/') ||
        startsWith(github.event.pull_request.head.ref, 'worktree-')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 60); do
            bucket="$(
              gh pr checks "$PR_URL" \
                --json name,bucket \
                --jq '.[] | select(.name == "Build, lint, typecheck, test") | .bucket' \
                2>/dev/null | head -n 1
            )"
            case "$bucket" in
              pass)
                exit 0
                ;;
              fail|cancel)
                echo "CI did not pass"
                exit 1
                ;;
              "")
                echo "waiting for CI to register"
                ;;
              *)
                echo "CI is ${bucket}"
                ;;
            esac
            sleep 15
          done
          echo "CI did not finish in time"
          exit 1

      - name: Compute deploy targets
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          files="$RUNNER_TEMP/pr-files.txt"
          targets="$RUNNER_TEMP/deploy-targets.txt"
          pr_number="${PR_URL##*/}"
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/files" \
            --paginate \
            --jq '.[].filename' > "$files"

          node scripts/ci/compute-deploy-targets.mjs "$files" | tee "$targets"
          cat "$targets" >> "$GITHUB_OUTPUT"
          node scripts/ci/security-review.mjs --required "$files" >> "$GITHUB_OUTPUT"

      - name: Wait for security review
        if: steps.targets.outputs.security_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          for _ in $(seq 1 40); do
            bucket="$(
              gh pr checks "$PR_URL" \
                --json name,bucket \
                --jq '.[] | select(.name == "Security Review") | .bucket' \
                2>/dev/null | head -n 1
            )"
            case "$bucket" in
              pass)
                exit 0
                ;;
              fail|cancel)
                echo "Security Review did not pass"
                exit 1
                ;;
              "")
                echo "waiting for Security Review to register"
                ;;
              *)
                echo "Security Review is ${bucket}"
                ;;
            esac
            sleep 15
          done
          echo "Security Review did not finish in time"
          exit 1

      - name: Merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --merge --delete-branch "$PR_URL"
