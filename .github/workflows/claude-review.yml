name: Claude Code Review

# NOTE: This workflow uses anthropics/claude-code-action which handles
# all user input internally. No untrusted input is used in run: commands.

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request. Check for:
            1. Security issues (XSS, injection, auth bypass, leaked secrets)
            2. Performance regressions (unnecessary re-renders, N+1 queries, missing memoization)
            3. Accessibility violations (missing labels, keyboard nav, ARIA)
            4. Anti-corny guardrails (no em dashes, no triplet lists, no fake vulnerability)
            5. Type safety (no `as` assertions on Supabase responses, no `any`)
            6. Dead code or duplicated logic

            Be concise. Only flag real issues, not style preferences.
          claude_args: "--max-turns 5 --model claude-sonnet-4-6"
