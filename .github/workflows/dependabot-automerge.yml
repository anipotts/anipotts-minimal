# Auto-merge dependabot PRs that are safe to ship without review.
#
# Auto-merges:
#   - patch updates (any dependency type)
#   - security advisories (any severity)
#   - dev-dependency minor updates (tooling churn, low blast radius)
#
# Leaves for manual review (no auto-merge enabled, PR just sits):
#   - production minor updates
#   - any major update
#
# Security note: only github.event.pull_request.html_url is referenced, and
# always via env: so the URL is shell-quoted by the runner. Other dependabot
# metadata fields come from the fetch-metadata action's controlled outputs,
# not free-form PR body / commit message text, so no injection surface.
#
# Mechanics: gh pr merge --auto sets the PR to merge once required status
# checks pass. Branch protection on main requires the "Build, lint, typecheck,
# test" check from ci.yml.

name: Dependabot Auto-Merge

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch, security, dev-minor)
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.ghsa-id != '' ||
          (steps.meta.outputs.dependency-type == 'direct:development' &&
           steps.meta.outputs.update-type == 'version-update:semver-minor')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"
