name: Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "target to smoke"
        required: true
        default: "www"
        type: choice
        options: ["www", "admin"]
      commit_sha:
        description: "commit sha expected to be deployed"
        required: true
        type: string
      mode:
        description: "admin smoke mode"
        required: true
        default: "unauthenticated"
        type: choice
        options: ["unauthenticated", "authenticated"]

permissions:
  contents: read

concurrency:
  group: smoke-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke ${{ inputs.target }}
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Smoke public site
        if: inputs.target == 'www'
        run: node scripts/ci/release-smoke.mjs --target www --base-url https://anipotts.com --expected-sha "${{ inputs.commit_sha }}"

      - name: Smoke admin
        if: inputs.target == 'admin'
        run: node scripts/ci/release-smoke.mjs --target admin --mode "${{ inputs.mode }}" --base-url https://admin.anipotts.com --expected-sha "${{ inputs.commit_sha }}"
        env:
          ADMIN_CI_ACCESS_CLIENT_ID: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_ID }}
          ADMIN_CI_ACCESS_CLIENT_SECRET: ${{ secrets.ADMIN_CI_ACCESS_CLIENT_SECRET }}
          ADMIN_CI_READ_TOKEN: ${{ secrets.ADMIN_CI_READ_TOKEN }}
